<div class="init-container">
  <div class="hero-section">
    <div class="illustration">
      <img src="home-illustration.png" alt="Heroes App Illustration" />
    </div>

    <h1 class="title">Bienvenido a Heroes App</h1>

    <p class="subtitle">
      Explora, crea y administra tu colección personal de superhéroes.
      <br />
      Todo guardado localmente en tu navegador.
    </p>

    <div class="action-buttons">
      <button mat-raised-button color="primary" routerLink="/heroes/list">
        <mat-icon>view_list</mat-icon>
        Ver héroes
      </button>

      <button mat-raised-button routerLink="/heroes/new">
        <mat-icon>add_circle</mat-icon>
        Crear héroe
      </button>
    </div>
  </div>
</div>
